<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge « Je suis CAP » – CAP Compétences & Consultance</title>
<style>
  :root{
    --navy:#08275F; --blue:#0B3C91; --blue2:#1A5FC8;
    --orange:#F7931E; --orange-dark:#B34A00; --green:#23803A;
    --paper:#F3F6FC; --ink:#14264D; --muted:#5B6B8C; --line:#D5DFF2;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.45 "Segoe UI","Helvetica Neue",Arial,Roboto,sans-serif;
  }
  .sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); border:0}

  /* Bandeau */
  .top{background:linear-gradient(100deg,var(--navy),var(--blue2)); color:#fff}
  .top-in{max-width:1200px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px}
  .top img{width:56px; height:56px; border-radius:12px; background:#fff; display:block; flex:none}
  .top h1{margin:0; font-size:1.25rem; font-weight:700}
  .top p{margin:2px 0 0; font-size:.92rem; color:#CFE0FF}
  .flag{height:6px; background:linear-gradient(90deg,#002664 0 33.33%,#FECB00 33.33% 66.66%,#C60C30 66.66%)}

  /* Mise en page */
  main{
    max-width:1200px; margin:0 auto; padding:20px; display:grid; gap:16px;
    grid-template-areas:"stage" "form" "actions";
  }
  .right{display:contents}
  .stage{grid-area:stage} .form{grid-area:form} .actions-wrap{grid-area:actions}
  @media (min-width:1020px){
    main{grid-template-columns:380px minmax(0,1fr); grid-template-areas:"form right"; align-items:start; gap:20px}
    .right{display:block; grid-area:right; position:sticky; top:16px}
    .stage, .actions-wrap{grid-area:auto}
    .actions-wrap{margin-top:14px}
  }
  /* Sur petit écran, l’aperçu reste visible en haut pendant la saisie */
  @media (max-width:1019px){
    html{scroll-padding-top:44vh}
    .stage{position:sticky; top:0; z-index:10; border-radius:0 0 16px 16px; box-shadow:0 10px 20px rgba(8,39,95,.16)}
    #badge{max-height:40vh}
  }
  .panel{background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px}
  .panel h2{margin:0 0 16px; font-size:1.05rem}

  /* Formulaire */
  label.f{display:block; margin:0 0 14px; font-weight:600; font-size:.92rem}
  label.f > span{display:block; margin-bottom:6px}
  input[type=text], input[type=url], select{
    width:100%; height:46px; padding:0 12px; font:inherit; color:var(--ink);
    background:#fff; border:1.5px solid #C5D2EA; border-radius:10px;
  }
  input::placeholder{color:#9AA8C4}
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible,
  .sr-only:focus-visible + label{outline:3px solid rgba(247,147,30,.55); outline-offset:1px}
  input[type=text]:focus, input[type=url]:focus, select:focus{border-color:var(--orange)}
  .hint{margin:6px 0 0; font-size:.84rem; font-weight:400; color:var(--muted)}
  .photo-box{margin:0 0 16px; padding:14px; border:1.5px dashed #AFC0E3; border-radius:12px; background:#F8FAFE}
  .photo-box .row{display:flex; gap:8px; flex-wrap:wrap}
  .photo-box .msg{margin:8px 0 0; font-size:.88rem; color:#B3261E; min-height:0}
  .range{display:grid; grid-template-columns:118px 1fr; align-items:center; gap:8px; margin-top:10px; font-size:.88rem; font-weight:600}
  input[type=range]{width:100%; accent-color:var(--orange)}
  input[type=range]:disabled{opacity:.45}
  details{margin:4px 0 14px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:#fff}
  summary{cursor:pointer; padding:12px 0; font-weight:600; font-size:.92rem}
  details[open] summary{border-bottom:1px solid var(--line); margin-bottom:12px}
  details > label.f:last-child{margin-bottom:14px}

  /* Boutons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    height:46px; padding:0 18px; font:inherit; font-weight:700; cursor:pointer;
    border:2px solid transparent; border-radius:10px; color:#fff; white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.5; cursor:not-allowed; filter:none}
  .btn-blue{background:var(--blue)}
  .btn-green{background:var(--green)}
  .btn-orange{background:#fff; color:var(--orange-dark); border-color:var(--orange)}
  .btn-ghost{background:#fff; color:var(--blue); border-color:#C5D2EA; height:42px; font-weight:600}
  .reset{width:100%}

  /* Aperçu */
  .stage{padding:12px}
  #badge{display:block; width:auto; max-width:100%; height:auto; margin:0 auto; border-radius:10px; background:#12349F; cursor:default}
  @media (min-width:1020px){ #badge{max-height:calc(100vh - 215px)} }
  .actions{display:flex; flex-wrap:wrap; gap:10px}
  .note{margin:12px 2px 0; font-size:.88rem; color:var(--muted)}
  @media (max-width:560px){
    main{padding:0 14px 14px}
    .stage{padding:8px}
    .actions .btn{flex:1 1 100%}
  }

  /* Impression : seul le badge est imprimé */
  @page{size:A4 portrait; margin:10mm}
  @media print{
    html, body{background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .top, .flag, .form, .actions-wrap{display:none !important}
    main{display:block; padding:0; max-width:none}
    .right{display:block; position:static}
    .stage{position:static; border:0; padding:0; background:none; box-shadow:none; border-radius:0}
    #badge{width:auto; height:auto; max-width:190mm; max-height:275mm; border-radius:0}
  }
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="top-in">
      <img id="brandLogo" alt="Logo CAP Compétences & Consultance Tchad" width="56" height="56">
      <div>
        <h1>Mon badge CAP</h1>
        <p>CAP Compétences & Consultance, Tchad</p>
      </div>
    </div>
  </div>
  <div class="flag"></div>
</header>

<main>
  <section class="panel form" aria-labelledby="t-form">
    <h2 id="t-form">Créez votre badge</h2>

    <div class="photo-box">
      <input class="sr-only" id="photo" type="file" accept="image/*">
      <div class="row">
        <label class="btn btn-blue" for="photo">Choisir une photo</label>
        <button class="btn btn-ghost" id="btnNoPhoto" type="button" disabled>Retirer</button>
      </div>
      <p class="msg" id="photoMsg" role="alert"></p>
      <div class="range"><label for="zoom">Zoom</label><input id="zoom" type="range" min="100" max="300" value="100" disabled></div>
      <div class="range"><label for="posx">Gauche / droite</label><input id="posx" type="range" min="-100" max="100" value="0" disabled></div>
      <div class="range"><label for="posy">Haut / bas</label><input id="posy" type="range" min="-100" max="100" value="0" disabled></div>
    </div>

    <label class="f"><span>Nom complet</span>
      <input id="nom" type="text" autocomplete="name" placeholder="Ex. Prénom et nom">
    </label>

    <label class="f"><span>Votre domaine</span>
      <input id="domaine" type="text" autocomplete="off" placeholder="Ex. Sociologue, spécialiste du suivi-évaluation">
    </label>

    <label class="f"><span>Ville de résidence</span>
      <input id="ville" type="text" autocomplete="address-level2" list="villes" placeholder="Ex. Moundou">
    </label>

    <details>
      <summary>Réglages du badge (organisateur)</summary>
      <label class="f"><span>Lien du QR code</span>
        <input id="lien" type="url" inputmode="url" autocomplete="off" value="https://www.facebook.com/share/1FuEAvsBUU/" placeholder="https://…">
        <span class="hint">Collez le lien d’inscription (WhatsApp, Facebook, formulaire…). Sans lien, le QR code affiche le nom de CAP.</span>
      </label>
      <label class="f"><span>Accroche, ligne 1</span>
        <input id="l1" type="text" autocomplete="off" value="JE SUIS CAP">
      </label>
      <label class="f"><span>Accroche, ligne 2</span>
        <input id="l2" type="text" autocomplete="off" value="ET TOI ?">
      </label>
      <label class="f"><span>Texte sous le QR code</span>
        <input id="legende" type="text" autocomplete="off" value="INSCRIS-TOI">
      </label>
      <label class="f"><span>Couleur d’accent</span>
        <select id="accent">
          <option value="orange">Orange CAP</option>
          <option value="vert">Vert CAP</option>
          <option value="rouge">Rouge</option>
        </select>
      </label>
    </details>

    <button class="btn btn-ghost reset" id="btnReset" type="button">Effacer mes informations</button>

    <datalist id="villes">
      <option value="N’Djamena"><option value="Moundou"><option value="Sarh"><option value="Abéché">
      <option value="Kélo"><option value="Laï"><option value="Bongor"><option value="Doba">
      <option value="Koumra"><option value="Mongo"><option value="Pala"><option value="Am-Timan">
      <option value="Ati"><option value="Fada"><option value="Faya-Largeau"><option value="Mao">
      <option value="Bol"><option value="Massakory"><option value="Massenya"><option value="Goz-Beïda">
      <option value="Moussoro"><option value="Biltine"><option value="Goré"><option value="Bébédjia">
      <option value="Iriba"><option value="Adré"><option value="Kyabé"><option value="Léré">
    </datalist>
  </section>

  <div class="right">
    <section class="panel stage" aria-label="Aperçu du badge">
      <canvas id="badge" width="1080" height="1350" role="img" aria-label="Aperçu du badge Je suis CAP"></canvas>
    </section>

    <div class="actions-wrap">
      <div class="actions">
        <button class="btn btn-blue" id="btnPng" type="button">Télécharger l’image</button>
        <button class="btn btn-green" id="btnShare" type="button" hidden>Partager</button>
        <button class="btn btn-orange" id="btnPrint" type="button">Imprimer</button>
      </div>
      <p class="note">Le badge se met à jour pendant la saisie. Sur ordinateur, vous pouvez aussi déplacer la photo avec la souris.</p>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';

/* >>> Pour que le QR code ouvre directement votre page d’inscription,
       écrivez le lien entre les guillemets (ex. "https://wa.me/..." ou "https://facebook.com/...").
       Il peut aussi être saisi dans « Réglages du badge » sur la page. */
const LIEN_INSCRIPTION = "https://www.facebook.com/share/1FuEAvsBUU/";

/* ------------------------------------------------------------------ */
/*  Générateur de QR code (octets, correction d’erreurs M, versions 1-10) */
/* ------------------------------------------------------------------ */
const QR = (function(){
  const RAW  = [0,26,44,70,100,134,172,196,242,292,346];
  const ECC  = [0,10,16,26,18,24,16,18,22,22,26];
  const BLK  = [0,1,1,1,2,2,4,4,4,5,5];
  const ALIGN= [[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];

  function gfMul(x,y){
    let z=0;
    for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; }
    return z;
  }
  function rsDivisor(deg){
    const r=new Array(deg).fill(0); r[deg-1]=1; let root=1;
    for(let i=0;i<deg;i++){
      for(let j=0;j<deg;j++){ r[j]=gfMul(r[j],root); if(j+1<deg) r[j]^=r[j+1]; }
      root=gfMul(root,2);
    }
    return r;
  }
  function rsRemainder(data,div){
    const r=new Array(div.length).fill(0);
    for(const b of data){
      const f=b^r.shift(); r.push(0);
      div.forEach((c,i)=>{ r[i]^=gfMul(c,f); });
    }
    return r;
  }
  const bit=(v,i)=>((v>>>i)&1)!==0;

  function make(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let ver=0;
    for(let v=1;v<=10;v++){
      const cap=(RAW[v]-ECC[v]*BLK[v])*8;
      if(4+(v<10?8:16)+8*bytes.length<=cap){ ver=v; break; }
    }
    if(!ver) return null;

    const dataCw=RAW[ver]-ECC[ver]*BLK[ver];
    const bits=[];
    const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length, ver<10?8:16); bytes.forEach(b=>put(b,8));
    put(0, Math.min(4, dataCw*8-bits.length));
    while(bits.length%8) bits.push(0);
    for(let pad=0xEC; bits.length<dataCw*8; pad^=0xEC^0x11) put(pad,8);
    const data=[];
    for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }

    const nb=BLK[ver], eccLen=ECC[ver], raw=RAW[ver];
    const shortN=nb-raw%nb, shortLen=Math.floor(raw/nb);
    const div=rsDivisor(eccLen);
    const blocks=[]; let k=0;
    for(let i=0;i<nb;i++){
      const dat=data.slice(k,k+shortLen-eccLen+(i<shortN?0:1)); k+=dat.length;
      const ecc=rsRemainder(dat,div);
      if(i<shortN) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all=[];
    for(let i=0;i<blocks[0].length;i++){
      blocks.forEach((bl,j)=>{ if(i!==shortLen-eccLen||j>=shortN) all.push(bl[i]); });
    }

    const size=ver*4+17;
    const mod=Array.from({length:size},()=>new Array(size).fill(false));
    const fn =Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{ mod[y][x]=d; fn[y][x]=true; };

    for(let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const finder=(cx,cy)=>{
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
        const d=Math.max(Math.abs(dx),Math.abs(dy)), x=cx+dx, y=cy+dy;
        if(x>=0&&x<size&&y>=0&&y<size) setF(x,y,d!==2&&d!==4);
      }
    };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    const ap=ALIGN[ver], n=ap.length;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0)) continue;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++)
        setF(ap[i]+dx, ap[j]+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    function drawFormat(mask){
      const d=mask; let r=d;
      for(let i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537);
      const b=((d<<10)|r)^0x5412;
      for(let i=0;i<=5;i++) setF(8,i,bit(b,i));
      setF(8,7,bit(b,6)); setF(8,8,bit(b,7)); setF(7,8,bit(b,8));
      for(let i=9;i<15;i++) setF(14-i,8,bit(b,i));
      for(let i=0;i<8;i++) setF(size-1-i,8,bit(b,i));
      for(let i=8;i<15;i++) setF(8,size-15+i,bit(b,i));
      setF(8,size-8,true);
    }
    drawFormat(0);
    if(ver>=7){
      let r=ver; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25);
      const b=(ver<<12)|r;
      for(let i=0;i<18;i++){
        const c=bit(b,i), a=size-11+i%3, d=Math.floor(i/3);
        setF(a,d,c); setF(d,a,c);
      }
    }

    let idx=0;
    for(let right=size-1;right>=1;right-=2){
      if(right===6) right=5;
      for(let vert=0;vert<size;vert++){
        for(let j=0;j<2;j++){
          const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
          if(!fn[y][x]&&idx<all.length*8){ mod[y][x]=bit(all[idx>>>3],7-(idx&7)); idx++; }
        }
      }
    }

    const maskFn=[
      (x,y)=>(x+y)%2===0, (x,y)=>y%2===0, (x,y)=>x%3===0, (x,y)=>(x+y)%3===0,
      (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>x*y%2+x*y%3===0, (x,y)=>(x*y%2+x*y%3)%2===0, (x,y)=>((x+y)%2+x*y%3)%2===0
    ];
    const applyMask=m=>{
      for(let y=0;y<size;y++) for(let x=0;x<size;x++)
        if(!fn[y][x]&&maskFn[m](x,y)) mod[y][x]=!mod[y][x];
    };
    function penalty(){
      let p=0;
      for(let t=0;t<2;t++) for(let i=0;i<size;i++){
        let run=1, s='';
        for(let j=0;j<size;j++){
          const v=t?mod[j][i]:mod[i][j];
          s+=v?'1':'0';
          if(j>0){
            const pv=t?mod[j-1][i]:mod[i][j-1];
            if(v===pv) run++; else { if(run>=5) p+=run-2; run=1; }
          }
        }
        if(run>=5) p+=run-2;
        p+=40*((s.match(/10111010000/g)||[]).length+(s.match(/00001011101/g)||[]).length);
      }
      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){
        const v=mod[y][x];
        if(v===mod[y][x+1]&&v===mod[y+1][x]&&v===mod[y+1][x+1]) p+=3;
      }
      let dark=0; mod.forEach(r=>r.forEach(v=>{ if(v) dark++; }));
      const tot=size*size;
      p+=Math.max(0,Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;
      return p;
    }
    let best=0, bestP=Infinity;
    for(let m=0;m<8;m++){
      applyMask(m); drawFormat(m);
      const p=penalty(); if(p<bestP){ bestP=p; best=m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return {size, mod, version:ver};
  }
  return {make};
})();

/* ------------------------------------------------------------------ */
/*  État et formulaire                                                 */
/* ------------------------------------------------------------------ */
const $=id=>document.getElementById(id);
const LOGO_SRC='FB_IMG_1794830569540.jpg';
const W=1080, H=1350;
const FF='"Montserrat","Segoe UI","Helvetica Neue",Arial,Roboto,sans-serif';
const ACC={
  orange:{main:'#F26B0F', light:'#FFAA33'},
  vert:  {main:'#23803A', light:'#79D78F'},
  rouge: {main:'#E1242B', light:'#FF6B70'}
};
const el={
  nom:$('nom'), domaine:$('domaine'), ville:$('ville'),
  lien:$('lien'), l1:$('l1'), l2:$('l2'), legende:$('legende'), accent:$('accent')
};
const cv=$('badge');
const STORE='cap-badge-v1';
const ADMIN=['lien','l1','l2','legende','accent'];

let photo=null, zoom=1, px=0, py=0;          // photo = canvas source réduit

function read(){
  return {
    nom:el.nom.value.trim(), domaine:el.domaine.value.trim(), ville:el.ville.value.trim(),
    lien:el.lien.value.trim(), l1:el.l1.value.trim(), l2:el.l2.value.trim(),
    legende:el.legende.value.trim(), accent:el.accent.value
  };
}
function saveAdmin(){
  const s={}; ADMIN.forEach(k=>{ s[k]=el[k].value; });
  try{ localStorage.setItem(STORE,JSON.stringify(s)); }catch(e){}
}
function restoreAdmin(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(STORE)||'null'); }catch(e){}
  if(s) ADMIN.forEach(k=>{ if(typeof s[k]==='string') el[k].value=s[k]; });
  if(!el.lien.value && LIEN_INSCRIPTION) el.lien.value=LIEN_INSCRIPTION;
}

/* ------------------------------------------------------------------ */
/*  Outils de dessin                                                   */
/* ------------------------------------------------------------------ */
const logo=new Image();
logo.onload=()=>draw();
logo.src=LOGO_SRC;
$('brandLogo').src=LOGO_SRC;

function rr(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function ellipsize(g,t,maxW){
  if(g.measureText(t).width<=maxW) return t;
  while(t.length>1&&g.measureText(t+'…').width>maxW) t=t.slice(0,-1);
  return t.trimEnd()+'…';
}
function fit(g,t,weight,start,min,maxW){
  for(let s=start;s>=min;s-=2){
    g.font=weight+' '+s+'px '+FF;
    if(g.measureText(t).width<=maxW) return {size:s,text:t};
  }
  g.font=weight+' '+min+'px '+FF;
  return {size:min,text:ellipsize(g,t,maxW)};
}
function breakLines(g,t,maxW){
  const words=t.split(/\s+/), lines=[]; let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if(!cur||g.measureText(test).width<=maxW) cur=test; else { lines.push(cur); cur=w; }
  }
  if(cur) lines.push(cur);
  return lines;
}
function wrap(g,t,weight,start,min,maxW,maxLines){
  for(let s=start;s>=min;s-=2){
    g.font=weight+' '+s+'px '+FF;
    const lines=breakLines(g,t,maxW);
    if(lines.length<=maxLines&&lines.every(l=>g.measureText(l).width<=maxW)) return {size:s,lines};
  }
  g.font=weight+' '+min+'px '+FF;
  const all=breakLines(g,t,maxW);
  const lines=all.slice(0,maxLines);
  if(all.length>maxLines) lines[maxLines-1]+='…';
  return {size:min,lines:lines.map(l=>ellipsize(g,l,maxW))};
}
function pinShape(g,x,y,h,color){          // (x,y) = pointe du repère
  g.save(); g.translate(x,y); g.scale(h/64,h/64);
  g.fillStyle=color; g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(-8,-14,-26,-30,-26,-42);
  g.arc(0,-42,26,Math.PI,0);
  g.bezierCurveTo(26,-30,8,-14,0,0);
  g.moveTo(11,-42); g.arc(0,-42,11,0,Math.PI*2,true);
  g.fill('evenodd');
  g.restore();
}
function qrPayload(lien){
  let t=(lien||'').trim();
  if(!t) return 'CAP COMPETENCES & CONSULTANCE TCHAD';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(t) && /^[^\s]+\.[^\s]{2,}/.test(t)) t='https://'+t;
  return t;
}

/* Cercle photo : géométrie partagée entre le dessin et la souris */
const PH={cx:540, cy:452, r:176};
function photoGeom(){
  const d=2*PH.r, base=Math.max(d/photo.width,d/photo.height), s=base*zoom;
  const iw=photo.width*s, ih=photo.height*s;
  return {iw,ih,maxX:Math.max(0,(iw-d)/2),maxY:Math.max(0,(ih-d)/2)};
}

/* ------------------------------------------------------------------ */
/*  Dessin du badge                                                    */
/* ------------------------------------------------------------------ */
function draw(){
  const d=read(), A=ACC[d.accent]||ACC.orange;
  const g=cv.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  g.textAlign='left'; g.textBaseline='alphabetic';

  /* Fond bleu et formes en diagonale */
  let gr=g.createLinearGradient(0,0,W*0.55,H);
  gr.addColorStop(0,'#2349CF'); gr.addColorStop(.55,'#12349F'); gr.addColorStop(1,'#0A1A6B');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.07)';
  g.beginPath(); g.moveTo(690,0); g.lineTo(W,0); g.lineTo(W,440); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.04)';
  g.beginPath(); g.moveTo(0,740); g.lineTo(600,H); g.lineTo(0,H); g.closePath(); g.fill();
  g.fillStyle='rgba(4,12,70,.22)';
  g.beginPath(); g.moveTo(W,700); g.lineTo(W,H); g.lineTo(460,H); g.closePath(); g.fill();

  /* Disques d’accent */
  g.fillStyle=A.main;
  g.beginPath(); g.arc(-12,272,72,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(1102,1120,72,0,Math.PI*2); g.fill();

  /* En-tête : logo et nom de CAP */
  g.save(); rr(g,56,56,184,184,22); g.clip();
  g.fillStyle='#fff'; g.fillRect(56,56,184,184);
  if(logo.complete&&logo.naturalWidth) g.drawImage(logo,56,56,184,184);
  g.restore();

  g.font='700 30px '+FF;
  const pillTxt='TCHAD', pw=g.measureText(pillTxt).width+64;
  g.fillStyle=A.main; rr(g,1024-pw,74,pw,52,4); g.fill();
  g.fillStyle='#fff'; g.fillText(pillTxt,1024-pw+32,110);
  g.textAlign='right';
  const t=fit(g,'CAP Compétences & Consultance','800',48,30,740);
  g.font='800 '+t.size+'px '+FF; g.fillStyle='#fff'; g.fillText(t.text,1024,184);
  g.font='italic 500 28px '+FF; g.fillStyle='rgba(255,255,255,.88)';
  g.fillText('Former aujourd’hui, construire demain',1024,230);
  g.textAlign='left';

  /* Photo ronde */
  g.fillStyle=A.main; g.beginPath(); g.arc(PH.cx,PH.cy,PH.r+26,0,Math.PI*2); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(PH.cx,PH.cy,PH.r+12,0,Math.PI*2); g.fill();
  g.save();
  g.beginPath(); g.arc(PH.cx,PH.cy,PH.r,0,Math.PI*2); g.clip();
  if(photo){
    const q=photoGeom();
    g.fillStyle='#0A1A6B'; g.fillRect(PH.cx-PH.r,PH.cy-PH.r,2*PH.r,2*PH.r);
    g.drawImage(photo,PH.cx-q.iw/2+px*q.maxX,PH.cy-q.ih/2+py*q.maxY,q.iw,q.ih);
  }else{
    gr=g.createLinearGradient(0,PH.cy-PH.r,0,PH.cy+PH.r);
    gr.addColorStop(0,'#2A55D6'); gr.addColorStop(1,'#13328F');
    g.fillStyle=gr; g.fillRect(PH.cx-PH.r,PH.cy-PH.r,2*PH.r,2*PH.r);
    g.fillStyle='rgba(255,255,255,.28)';
    g.beginPath(); g.arc(PH.cx,PH.cy-34,56,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(PH.cx,PH.cy+120,118,92,0,0,Math.PI*2); g.fill();
    g.textAlign='center'; g.fillStyle='#fff';
    const pt=fit(g,'Ajoutez votre photo','700',34,22,300);
    g.font='700 '+pt.size+'px '+FF; g.fillText(pt.text,PH.cx,PH.cy+120);
    g.textAlign='left';
  }
  g.restore();

  /* Accroche */
  g.textAlign='center';
  const l1=(d.l1||'').toUpperCase(), l2=(d.l2||'').toUpperCase();
  if(l1){ const f=fit(g,l1,'800',116,56,960); g.font='800 '+f.size+'px '+FF; g.fillStyle='#fff'; g.fillText(f.text,W/2,772); }
  if(l2){ const f=fit(g,l2,'800',96,48,960);  g.font='800 '+f.size+'px '+FF; g.fillStyle=A.light; g.fillText(f.text,W/2,866); }

  /* Barre du nom */
  const hasNom=!!d.nom;
  const nf=fit(g,hasNom?d.nom.toUpperCase():'VOTRE NOM COMPLET',hasNom?'800':'italic 700',54,28,880);
  g.font=(hasNom?'800':'italic 700')+' '+nf.size+'px '+FF;
  const bw=Math.min(980,Math.max(g.measureText(nf.text).width+90,460));
  g.fillStyle=A.main; rr(g,(W-bw)/2,894,bw,88,4); g.fill();
  g.fillStyle=hasNom?'#fff':'rgba(255,255,255,.7)';
  g.fillText(nf.text,W/2,894+60);

  /* Domaine */
  const hasDom=!!d.domaine;
  const dw=wrap(g,hasDom?d.domaine:'Votre domaine ou votre spécialité',hasDom?'600':'italic 500',38,26,940,2);
  g.font=(hasDom?'600':'italic 500')+' '+dw.size+'px '+FF;
  g.fillStyle=hasDom?'#fff':'rgba(255,255,255,.6)';
  dw.lines.forEach((l,i)=>g.fillText(l,W/2,1040+i*Math.round(dw.size*1.22)));
  g.textAlign='left';

  /* Ville de résidence */
  pinShape(g,84,1260,78,'#fff');
  g.font='500 28px '+FF; g.fillStyle='rgba(255,255,255,.85)';
  g.fillText('Ma ville de Résidence',142,1188);
  const hasVille=!!d.ville;
  const vf=fit(g,hasVille?d.ville.toUpperCase():'VOTRE VILLE',hasVille?'800':'italic 700',70,34,660);
  g.font=(hasVille?'800':'italic 700')+' '+vf.size+'px '+FF;
  g.fillStyle=hasVille?'#fff':'rgba(255,255,255,.6)';
  g.fillText(vf.text,142,1260);

  /* QR code */
  const QX=830, QY=1104, QS=200;
  g.fillStyle='#fff'; rr(g,QX,QY,QS,QS,16); g.fill();
  const qr=QR.make(qrPayload(d.lien))||QR.make('CAP COMPETENCES & CONSULTANCE TCHAD');
  if(qr){
    const ms=Math.max(2,Math.floor(166/qr.size)), qp=ms*qr.size;
    const x0=Math.round(QX+(QS-qp)/2), y0=Math.round(QY+(QS-qp)/2);
    g.fillStyle='#0A1A6B';
    for(let y=0;y<qr.size;y++) for(let x=0;x<qr.size;x++)
      if(qr.mod[y][x]) g.fillRect(x0+x*ms,y0+y*ms,ms,ms);
  }
  if(d.legende){
    g.textAlign='center';
    const cf=fit(g,d.legende.toUpperCase(),'800',26,16,230);
    g.font='800 '+cf.size+'px '+FF; g.fillStyle='#fff';
    g.fillText(cf.text,QX+QS/2,QY+QS+30);
    g.textAlign='left';
  }
}

/* ------------------------------------------------------------------ */
/*  Photo : choix, réglages, déplacement à la souris                   */
/* ------------------------------------------------------------------ */
const ctl={zoom:$('zoom'), posx:$('posx'), posy:$('posy'), off:$('btnNoPhoto')};
function setPhotoUI(on){
  ctl.zoom.disabled=ctl.posx.disabled=ctl.posy.disabled=ctl.off.disabled=!on;
  cv.style.cursor=on?'grab':'pointer';
}
function resetAdjust(){
  zoom=1; px=0; py=0;
  ctl.zoom.value=100; ctl.posx.value=0; ctl.posy.value=0;
}
$('photo').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];
  const msg=$('photoMsg'); msg.textContent='';
  if(!file) return;
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{
    const max=1600, sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*sc)); c.height=Math.max(1,Math.round(im.naturalHeight*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    photo=c; resetAdjust(); setPhotoUI(true); draw();
  };
  im.onerror=()=>{
    URL.revokeObjectURL(url);
    msg.textContent='Cette image ne peut pas être lue. Choisissez une photo au format JPG ou PNG.';
  };
  im.src=url;
  e.target.value='';
});
ctl.off.addEventListener('click',()=>{ photo=null; resetAdjust(); setPhotoUI(false); draw(); });
ctl.zoom.addEventListener('input',()=>{ zoom=ctl.zoom.value/100; draw(); });
ctl.posx.addEventListener('input',()=>{ px=ctl.posx.value/100; draw(); });
ctl.posy.addEventListener('input',()=>{ py=ctl.posy.value/100; draw(); });

function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height};
}
function inPhoto(p){ return Math.hypot(p.x-PH.cx,p.y-PH.cy)<=PH.r+26; }
let drag=null;
cv.addEventListener('click',e=>{
  if(!photo&&inPhoto(canvasPoint(e))) $('photo').click();
});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||!photo||!inPhoto(canvasPoint(e))) return;
  const q=photoGeom();
  drag={x:e.clientX,y:e.clientY,px,py,q};
  cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
  if(!drag) return;
  const r=cv.getBoundingClientRect(), k=cv.width/r.width;
  const dx=(e.clientX-drag.x)*k, dy=(e.clientY-drag.y)*k;
  px=drag.q.maxX?Math.max(-1,Math.min(1,drag.px+dx/drag.q.maxX)):0;
  py=drag.q.maxY?Math.max(-1,Math.min(1,drag.py+dy/drag.q.maxY)):0;
  ctl.posx.value=Math.round(px*100); ctl.posy.value=Math.round(py*100);
  draw();
});
const endDrag=()=>{ if(drag){ drag=null; cv.style.cursor=photo?'grab':'pointer'; } };
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

/* ------------------------------------------------------------------ */
/*  Export : image, partage, impression                                */
/* ------------------------------------------------------------------ */
function fileName(){
  const base=read().nom.normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'');
  return 'badge-CAP-'+(base||'moi')+'.png';
}
function toBlob(){ return new Promise(res=>cv.toBlob(res,'image/png')); }
function saveBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
}
$('btnPng').addEventListener('click',async()=>{
  draw();
  const b=await toBlob(); if(b) saveBlob(b,fileName());
});
$('btnPrint').addEventListener('click',()=>{ draw(); window.print(); });

(function(){
  try{
    const probe=new File([new Blob(['x'])],'a.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[probe]})) $('btnShare').hidden=false;
  }catch(e){}
})();
$('btnShare').addEventListener('click',async()=>{
  draw();
  const b=await toBlob(); if(!b) return;
  const f=new File([b],fileName(),{type:'image/png'});
  try{ await navigator.share({files:[f],title:'Je suis CAP'}); }catch(e){}
});

/* ------------------------------------------------------------------ */
/*  Champs                                                             */
/* ------------------------------------------------------------------ */
['nom','domaine','ville'].forEach(k=>el[k].addEventListener('input',draw));
ADMIN.forEach(k=>{
  el[k].addEventListener('input',()=>{ saveAdmin(); draw(); });
  el[k].addEventListener('change',()=>{ saveAdmin(); draw(); });
});
$('btnReset').addEventListener('click',()=>{
  el.nom.value=''; el.domaine.value=''; el.ville.value='';
  photo=null; resetAdjust(); setPhotoUI(false); $('photoMsg').textContent='';
  draw(); el.nom.focus();
});

restoreAdmin();
setPhotoUI(false);
draw();
})();
</script>
